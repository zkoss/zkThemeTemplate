<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" font-family="monospace" font-size="12">
  <!-- Background page -->
  <rect width="400" height="320" fill="#f5f5f5"/>
  
  <!-- Mask overlay -->
  <rect width="400" height="320" fill="rgba(0,0,0,0.5)" opacity="0.5"/>
  
  <!-- Coachmark pointer (up arrow triangle) -->
  <!-- .z-coachmark-pointer.z-coachmark-up: border-bottom-color = rgb(55,111,208) -->
  <polygon points="40,165 60,165 50,155" fill="rgb(55,111,208)"/>
  
  <!-- Coachmark content card -->
  <!-- bg=rgb(55,111,208) radius=6px shadow elevation-2 padding=16px -->
  <rect x="10" y="165" width="291" height="98" rx="6" ry="6" 
        fill="rgb(55,111,208)" 
        filter="drop-shadow(0px 2px 6px rgba(0,0,0,0.12))"/>
  
  <!-- Close button (top-right of card) -->
  <text x="285" y="183" fill="white" font-size="14">×</text>
  
  <!-- Content label text (white on primary) -->
  <text x="26" y="200" fill="white" font-size="13">Coachmark guided-tour card</text>
  <text x="26" y="220" fill="white" font-size="11">bg: rgb(55,111,208) | color: white</text>
  <text x="26" y="238" fill="white" font-size="11">radius: 6px | padding: 16px</text>
  <text x="26" y="256" fill="white" font-size="11">elevation-2 | position: absolute</text>
  
  <!-- Labels -->
  <text x="10" y="150" fill="#ffd54f" font-size="10">▲ .z-coachmark-pointer.z-coachmark-up</text>
  <text x="10" y="310" fill="#fff" font-size="10">mask: rgba(0,0,0,0.5) | opacity: 0 (closed) / 1 (open)</text>
  
  <!-- Title -->
  <text x="10" y="20" fill="#333" font-size="14" font-weight="bold">coachmark.zul — iter 4 measurement diagram</text>
  <text x="10" y="35" fill="#666" font-size="10">Screenshot tool blocked (document_idle desync); all values from getComputedStyle</text>
</svg>
